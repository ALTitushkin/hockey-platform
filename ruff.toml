# Линтер/форматтер (ruff). Общий для bot/ и tools/.
target-version = "py312"
line-length = 120

# Скрипты сборки календаря — рабочая кухня исследователя, не продуктовый код.
# Папка в git с 17.10.2026 (из неё `validate_calendar.py --sync` забирает батч), но
# CI не должен краснеть от замечаний в чужом по стилю коде.
exclude = ["tools/calendar-build"]

[lint]
# E — стиль/ошибки, F — pyflakes (мёртвые импорты/переменные).
# I — сортировка импортов (включена 17.10.2026 после однократного `ruff check --fix`).
select = ["E", "F", "I"]

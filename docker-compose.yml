# Хоккей-бот на app-VPS. Long polling, домен и Caddy не нужны.
#
# ВАЖНО: ровно ОДИН инстанс. Два потребителя getUpdates на один токен →
# Telegram отдаёт 409 Conflict, бот начинает «мигать», и ломается это тихо.
# Никаких replicas/scale. Перед первым стартом убедиться, что старый systemd-юнит
# на личном сервере остановлен и disabled (см. deploy/README.md).
services:
  bot:
    build: .
    image: hockey-bot:latest
    container_name: hockey-bot
    restart: unless-stopped

    # Секреты — из .env на сервере (в репо не коммитим, он в .gitignore).
    # .env — БЕЗ инлайн-комментариев в строках значений: роняло прод у PrizeDrawing.
    # Нужна строка BOT_TOKEN=... целиком, голый токен не парсится.
    env_file: .env

    # tini как PID 1: форвардит SIGTERM в python и жнёт зомби — чистый рестарт.
    init: true

    # Логи спроса переживают пересборку образа. Каталог ./runtime на хосте
    # должен принадлежать UID 1000 (см. deploy/README.md).
    volumes:
      - ./runtime:/app/runtime

    # Эквивалент systemd MemoryMax. Боту хватает с запасом: на старом стенде
    # процесс занимал ~27 МБ.
    mem_limit: 256m
    # Своп не даём: пик с лимитом — 36 МБ, своп 0, OOM 0 (замер 24.10.2026).
    # Без этой строки Docker разрешает ещё столько же свопа (итого 512m).
    memswap_limit: 256m

    # Иначе json-file растёт без предела и съедает диск.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Новостник «Культура хоккея» (news/). Профиль news: обычный `docker compose up` его не трогает,
  # поднимает deploy.sh, только если на сервере есть news/.env (выключатель — см. deploy/README.md).
  # Образ НЕ собирается на сервере: CI кладёт его в GHCR, deploy.sh тянет по SHA и ставит тег latest;
  # прошлый получает тег previous — откат без сборки (workflow_dispatch, news_image=previous).
  # Тоже ровно ОДИН инстанс: свой токен NEWS_BOT_TOKEN, второй getUpdates → 409.
  news:
    profiles: ["news"]
    image: ghcr.io/altitushkin/hockey-news:latest
    pull_policy: never
    container_name: hockey-news
    restart: unless-stopped
    env_file: news/.env
    environment:
      # На сервере вводную пишет только Claude: GigaChat прошёл гард, но путал факты (news/prompts/README.md).
      NEWS_LLM: claude_cli
      # Чистый гард → сразу в канал, владельцу отчёт (решение владельца 25.10.2026). "0" — снова кнопки.
      NEWS_AUTO_PUBLISH: "1"
    init: true
    # Харденинг по стандарту: файловая система только на чтение, без capabilities и повышения прав.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m
      # конфиг Claude Code CLI (~/.claude*) живёт только в памяти контейнера
      - /home/app:size=32m,uid=1000,gid=1000,mode=0700
    # Черновики, карточки и состояние сервиса переживают пересоздание. Владелец — UID 1000.
    volumes:
      - ./news-runtime:/app/news/out
    # Python + Pillow ~60 МБ, остальное — Claude Code CLI в момент вызова (раз в сутки).
    # Сумма лимитов на app-VPS с ним — в project/process/ops_notes.md (замер перед выкатом).
    mem_limit: 384m
    memswap_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

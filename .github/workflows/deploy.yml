# CI/CD бота: тесты → деплой на app-VPS при пуше в main.
# Требует secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     — IP app-VPS (88.218.250.212)
#   VPS_USER     — ssh-пользователь (deploy)
#   VPS_SSH_KEY  — приватный ключ (отдельный deploy-ключ, не личный!)
# И repo variable:
#   DEPLOY_ENABLED — 'true' включает выкат (включён с 30.08.2026). Ставить 'false'
#                    на время любого переезда бота: иначе случайный пуш поднимет
#                    второй инстанс → 409 Conflict на getUpdates.
#
# Новостник (news/): образ собирает CI (job news-image) и кладёт в GHCR
# ghcr.io/altitushkin/hockey-news:<sha>; сервер только тянет его — без сборки.
# Откат новостника: Actions → CI/CD bot → Run workflow → news_image=previous (или SHA).

name: CI/CD bot

concurrency:
  group: hockey-${{ github.ref }}
  cancel-in-progress: false

on:
  # Ручной выкат/откат новостника без сборки: news_image = previous | <sha>.
  workflow_dispatch:
    inputs:
      news_image:
        description: "Тег образа новостника: previous (откат) или SHA коммита"
        required: true
        default: previous
  push:
    branches: [main, "release/**"]
    paths:
      - "bot/**"
      - "data/**"
      - "tools/**"
      - "news/**"
      - "tests/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  # PR в main гоняет только тесты — деплоя из PR нет (см. if у job deploy).
  # Так битый коммит проверяется гейтом, не рискуя продом.
  pull_request:
    branches: [main]
    paths:
      - "bot/**"
      - "data/**"
      - "tools/**"
      - "news/**"
      - "tests/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/deploy.yml"

jobs:
  # ── Гейт: без зелёных тестов деплоя не будет ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release version before deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 tools/release_version.py
      - uses: actions/setup-python@v7
        with:
          # Держим ту же версию, что в контейнере (Dockerfile: python:3.12-slim),
          # иначе тесты зелёные на одной версии, а прод падает на другой.
          python-version: "3.12"
      - name: Install deps
        run: pip install -q -r bot/requirements.txt
      - name: Lint (ruff)
        run: |
          pip install -q ruff
          ruff check bot/ tools/ news/ tests/
          bash -n deploy/deploy.sh
          bash -n deploy/ci-ssh.sh
      - name: Validate data (целостность реестров + паритет зеркал + status)
        run: python tools/validate_data.py
      - name: Validate calendar (формат событий + отчёт покрытия)
        run: python tools/validate_calendar.py
      - name: Bot tests (без токена)
        run: |
          cd bot
          python test_search.py
          python test_calendar.py
      - name: News tests (без сети)
        run: |
          pip install -q -r news/requirements.txt
          python -m news.test_news
          python -m unittest news.test_delivery
          python -m unittest discover -s tests

  # ── Образ новостника собирается в CI: ошибка Dockerfile видна до сервера ──
  news-image:
    # на ручном откате образ не собираем — откат обязан работать без сборки
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build news image
        run: docker build -f news/Dockerfile -t ghcr.io/altitushkin/hockey-news:${{ github.sha }} .
      - name: Smoke test (импорт, шрифты, логотипы, промпты, Codex CLI, read-only)
        run: |
          IMG=ghcr.io/altitushkin/hockey-news:${{ github.sha }}
          docker run --rm --read-only --tmpfs /home/app:uid=1000,gid=1000 "$IMG"             python -c "import news.run, news.card, news.shadow_runner, news.source_events; from PIL import Image; print('python ok')"
          docker run --rm --read-only --tmpfs /home/app:uid=1000,gid=1000 "$IMG"             sh -c 'codex --version && ! command -v claude && ls news/prompts/lead.md news/assets/logos/TBL.png news/assets/fonts/Oswald.ttf'
      - name: Push to GHCR (только main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/altitushkin/hockey-news:${{ github.sha }}

  # ── Деплой только после зелёных тестов и только при включённом флаге ──
  deploy:
    needs: [test, news-image]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' && needs.test.result == 'success'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.news-image.result == 'success')
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Deploy over SSH
        run: bash deploy/ci-ssh.sh
        env:
          DEPLOY_SHA: ${{ github.sha }}
          NEWS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.news_image || github.sha }}
          GHCR_USER: ${{ github.actor }}
          # Токен джоба живёт, пока идёт джоб: на сервере не остаётся постоянного секрета.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Public host key read through the trusted SSH connection on08.11; never TOFU in CI.
          VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDkWnSh+2HGLW73Kdu1IuoRprOA905+IhAPjaV/kKngs

  release-tag:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Annotated release tag after successful deployment
        run: |
          VERSION=$(python3 tools/release_version.py)
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
